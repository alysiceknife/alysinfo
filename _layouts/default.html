<!doctype html>
<style>
@font-face{
  font-family: Comic;
  font-weight: normal;
  src: local(''),
  url(/assets/fonts/ComicMono.ttf);
}
@font-face{
  font-family: Comic;
  font-style: bold;
  font-weight: bold;
  src: local(''),
  url(/assets/fonts/ComicMono-Bold.ttf);
}
*{
  box-sizing: border-box;
  padding: 0;
  margin: 0;
}
a{
  transition: text-shadow .5s;
}
a:link{
  color: lightseagreen;
  text-shadow: 1px 1px rgba(1,1,1,.2); 
}
a:visited{
  color: #238168;
  text-shadow: 1px 1px rgba(1,1,1,.2); 
}
a:hover{
  text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.3)
}


.layout {
  max-height: 100vh; max-width: 100vw;
  height: 100%; width: 100%;
  display: grid;
  grid:
    
    "header header header" 10vh
    "leftSide body rightSide" 90vh
    / 190px 1fr 8%
}
html,.body{ overflow: hidden; font-family:Comic;}
.header {background-image:url(assets/images/backgroundoverlay.png); background-position: right; background-repeat: no-repeat; padding-left: 1vw; line-height: 10vh; border-bottom: 3px solid black; z-index: -1; box-shadow: 5px 2px 5px rgb(29, 103, 128); grid-area: header; background-color: #238168;}
.leftSide { box-shadow: 2px 2px 5px rgb(29, 103, 128);
  z-index: 0;
   background-image:linear-gradient(to top, rgb(160, 160, 160), #d5d1cf); 
   height: 100vh; grid-area: leftSide; border-right: 3px solid black;
    padding-right: 7px;overflow-y: hidden;}
.body { grid-area: body;   max-height:90%;margin: 10px; display: flex; justify-content: center; }
.p{font-family:Comic;}
.rightSide { grid-area: rightSide; max-height: 500px;}
.footer { grid-area: footer; width: 100%; }
.h1{ color: blue;}
.main-text{background-image: linear-gradient(to top,rgba(0, 110, 255, 0.100)10%, rgb(255, 255, 255)); 
  border: 3px outset black; 
  border-top: 0px;
  width: 100%;
  max-width: 1000px; line-height: normal; 
  font-size: larger; overflow: hidden; overflow-y: scroll; height: 100%;
  padding: 20px;
  box-shadow: inset 0px -10px 10px 3px rgba(255, 255, 255, 1);
  text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.741); 
  color: rgb(46, 45, 52);
  
}
  
.mainheader{
  image-rendering: pixelated;
  background-image:url(assets/images/backgroundoverlay.png); background-position: 140%; 
  background-repeat: no-repeat;
  width: 100%;
  height: 3em;
  font-size: larger;
  background-color: #238168;
  border: 3px outset black;
  border-bottom: 2px solid black;
  align-content: center;
  text-align: center;
  color: white;
  text-shadow: 1px 1px 3px black;
}
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap');
.image-area{
    display: grid;
    grid-template-columns: 1fr auto; 
    gap: 15px;
    align-items: center;
    justify-content: center;

}
.main-text-holder{
  max-height: 100%;
  max-width: 1000px;
  width: 100%;
  margin: 20px;
  display: flex;
  flex-direction: column;
}
@media (max-width: 800px) {
  .leftSide{
    width: 130px;
  }
  .leftSide div{
    max-width: 130px;
    margin-left: 0px;
  }
  .leftSide a{
    margin-left: 0px;
  }
  .leftSide a div{
    margin-left: 0px;
    padding-left: 0px;
  }
  .leftSide div a{
    margin-left: 0px;
    padding-left: 0px;
  }
  .image-area {
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    flex-grow: shrink;
    justify-content: center;
    align-items: center;
  }
  .image-area div{
    
    align-self: center;
    align-content: center;
    justify-content: center;
    min-width: 0%;
  }
  .image-area div img{
    min-width: 0%;
    min-height: 0%;
    max-width: 200px;
    max-height: 200px;
    align-self: center;
    align-content: center;
  }
  .body{
    align-items: center;
    max-width: 100%;
  }
  .layout{
    grid:
    "header header" 10vh
    "leftSide body" 90vh
    / 130px 1fr 0%  
  }
}
</style>
<body>
  <div style="position: fixed; max-height: 100%; width:101vw; height: 100vh; z-index: -2; 
  background-image: url({{page.character}}); 
  background-position: right bottom; background-repeat: no-repeat;"></div>
<section class="layout">
  
  <div class="header">{%include header.html%}</div>
  <div class="leftSide">{%include sidebar.html%}</div>

      {%if page.wip != true%}

      <div class="body" style="overflow: visible;">
      <div class="main-text-holder"style="box-shadow: 3px 5px 10px black;">
      <div class="mainheader">{{page.title-verbose}}</div>
      <div class="main-text" 
      {%if page.flex_main%}
      style="display: flex;"
      {%endif%}
      >
      {{content}}
      </div>
      </div></div>
      {%else%}
      <div class="body" style="justify-content: center; align-items: center; flex-direction: column;">
        
      {%include under_construction.html%}
      <p><br><br></p>
      {{page.summary}}
    </div></div>
      {%endif%}
  <div class="rightSide"></div>
</section>

</body>
</html>
