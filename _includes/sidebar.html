<style>

.div a{
    
    padding-left: 20px;
}

@media (max-width: 800px){
    .div a{
        padding-left: 0px;
        margin-left: 0px;
        width: 130px;
    }
    .a{
        margin-left: 0px;
        padding-left: 0px;
    }
}

</style>

<div style="width:200px; height:2px; border-bottom:3px solid rgb(160, 160, 160); box-shadow: 0px 0px 5px black;"></div>

</div>
